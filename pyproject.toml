[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "media-archive"
version = "0.1.0"
description = "A local Linux CLI for importing, organizing, and archiving media."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.20,<2",
    "python-dotenv>=1.2.4,<1.3",
    "pydantic>=2.12,<3",
    "SQLAlchemy>=2.1,<2.2",
]

[project.scripts]
media-archive = "media_archive.cli:main"

[tool.setuptools]
include-package-data = false
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["media_archive*"]
namespaces = false
